name: IaCSecBench Measurement Harness

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: 'Latency repetitions per tool-case (detection is unaffected)'
        required: false
        default: '3'
      level:
        description: 'Matching strictness for the headline tables'
        required: false
        default: 'control'
        type: choice
        options: [control, resource, any]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure Baselines (Checkov, tfsec, Trivy, plan-level OPA, Layer 1)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      INPUT_REPEATS: ${{ inputs.repeats || '3' }}
      INPUT_LEVEL: ${{ inputs.level || 'control' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Workflow Inputs
        run: |
          set -eu
          case "$INPUT_REPEATS" in
            ''|*[!0-9]*) echo "::error::repeats must be a positive integer, got '$INPUT_REPEATS'"; exit 1 ;;
          esac
          if [ "$INPUT_REPEATS" -lt 1 ] || [ "$INPUT_REPEATS" -gt 25 ]; then
            echo "::error::repeats must be between 1 and 25, got '$INPUT_REPEATS'"
            exit 1
          fi
          case "$INPUT_LEVEL" in
            control|resource|any) ;;
            *) echo "::error::level must be control, resource or any, got '$INPUT_LEVEL'"; exit 1 ;;
          esac
          echo "repeats=$INPUT_REPEATS level=$INPUT_LEVEL"

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Setup Python Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Install OPA
        run: |
          set -eu
          OPA_VERSION="1.19.0"
          curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" -o opa
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Install tfsec
        run: |
          set -eu
          TFSEC_VERSION="1.28.14"
          curl -fsSL "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec-linux-amd64" -o tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/
          tfsec --version

      - name: Install Trivy
        run: |
          set -eu
          TRIVY_VERSION="0.73.0"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          tar xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Warm Trivy Checks Bundle
        run: |
          set -eu
          findings=$(trivy config benchmark/internal/cases --format json --quiet --skip-check-update \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(sum(len(r.get("Misconfigurations") or []) for r in d.get("Results") or []))')
          echo "cached bundle reports ${findings} misconfigurations on the corpus"
          if [ "$findings" -eq 0 ]; then
            echo "::error::trivy with --skip-check-update found nothing; the checks bundle is not cached"
            exit 1
          fi

      - name: Install Checkov
        run: |
          set -eu
          CHECKOV_VERSION="3.3.8"
          pip install "checkov==${CHECKOV_VERSION}"
          checkov --version

      - name: Assert All Tools Are Installed
        run: |
          set -eu
          missing=0
          for tool in terraform opa tfsec trivy checkov; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok: ${tool}"
            else
              echo "::error::${tool} is not installed; the comparison would silently omit it"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run Measurement Harness
        env:
          REPEATS: ${{ env.INPUT_REPEATS }}
          LEVEL: ${{ env.INPUT_LEVEL }}
          VALIDATE: terraform
        run: ./experiments/run_baselines.sh

      - name: Check Figure Sources Match Measured Results
        run: |
          if [ "$INPUT_LEVEL" != "control" ]; then
            echo "::notice::level=${INPUT_LEVEL}: the committed figures describe the"
            echo "::notice::control criterion, so they are not comparable with this run."
            echo "::notice::Figure gate skipped -- this is not a stale figure."
            exit 0
          fi

          python -m experiments.generate_figures --check || {
            echo "::error::paper/figures/*.mmd disagree with this measurement in something"
            echo "::error::other than latency -- a count, a version, or which tools ran."
            echo "::error::Run 'python -m experiments.generate_figures', re-render per"
            echo "::error::paper/figures/README.md, and commit both."
            exit 1
          }

      - name: Publish Result Summary
        if: always()
        run: |
          set -u
          {
            echo "## IaCSecBench measurement"
            echo
            echo "> **Latency in this run is not publishable.** It was measured on a shared"
            echo "> GitHub-hosted runner. Detection counts are deterministic and transfer;"
            echo "> latency reflects the host. Publishable latency requires an idle machine."
            echo
            if [ -f leaderboard/results.csv ]; then
              echo '### Measured leaderboard'
              echo
              echo '```'
              cat leaderboard/results.csv
              echo '```'
            else
              echo '_No leaderboard produced -- the harness did not reach the analysis stage._'
            fi
            echo
            if [ -f results/evaluation.json ]; then
              echo '### Caveats recorded with these results'
              echo
              python -c "import json;[print('-', c) for c in json.load(open('results/evaluation.json')).get('caveats', [])]"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Measured Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iacsecbench-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            results/run_manifest.json
            results/evaluation.json
            results/corpus_report.json
            results/tables/
            results/raw/
            leaderboard/results.csv
