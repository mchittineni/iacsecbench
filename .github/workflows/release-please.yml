name: Automated Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Please PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Toolchain
        if: ${{ steps.release.outputs.release_created }}
        uses: ./.github/actions/setup-pipeline

      - name: Build Benchmark Archives
        if: ${{ steps.release.outputs.release_created }}
        env:
          REF_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -eu
          mkdir -p release-artifacts
          zip -r "release-artifacts/iacsecbench-${REF_NAME}.zip" \
            benchmark/ \
            evaluation/ \
            experiments/ \
            infrastructure/ \
            leaderboard/ \
            results/ \
            security_framework/ \
            pyproject.toml \
            .checkov.yaml \
            README.md \
            CITATION.cff \
            LICENSE \
            -x '*/__pycache__/*' '*.pyc' 'infrastructure/.terraform/*'

      - name: Upload Benchmark Archives to Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -eu
          gh release upload "$REF_NAME" release-artifacts/*.zip --clobber
