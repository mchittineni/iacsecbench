repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The whitespace fixers skip results/ and leaderboard/. Those files are
      # written by evaluation/analyze.py and compared byte-for-byte across runs to
      # establish that a measurement is reproducible. analyze.py emits no trailing
      # newline, so end-of-file-fixer adds one, the next measurement removes it, and
      # the two fight forever -- manufacturing a 280-file diff that reads as though
      # the measurements changed when nothing did. Whitespace in a recorded artefact
      # is part of the artefact.
      - id: end-of-file-fixer
        exclude: ^(results/|leaderboard/)
      - id: trailing-whitespace
        exclude: ^(results/|leaderboard/)
      - id: fix-byte-order-marker
        exclude: ^(results/|leaderboard/)
      - id: mixed-line-ending
        exclude: ^(results/|leaderboard/)
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args:
          - "--in-place"
          - "--remove-unused-variables"
          - "--remove-all-unused-imports"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-pytest-style
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-print
          - darglint

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        args: ["--rcfile=pyproject.toml"]
