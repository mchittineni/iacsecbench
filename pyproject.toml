[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iacsecbench"
version = "3.0.0" # x-release-please-version
description = "IaCSecBench: a reproducible benchmark for Infrastructure-as-Code security scanners"
authors = [{ name = "Manideep Chittineni", email = "manideep.chittineni@hotmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "infrastructure-as-code",
    "cloud-security",
    "benchmark",
    "static-analysis",
    "policy-as-code",
    "terraform",
    "reproducibility",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Intended Audience :: Science/Research",
]

# Deliberately empty. Every module under evaluation/, experiments/, benchmark/,
# scripts/ and security_framework/ imports only the standard library; the tools
# under comparison are invoked as subprocesses and pinned by
# results/run_manifest.json, not resolved as Python packages. The web framework
# and search-client dependencies listed here previously belonged to an
# application that has moved to its own repository, and nothing in this one
# imported them.
dependencies = []

[project.urls]
Repository = "https://github.com/mchittineni/iacsecbench"
Documentation = "https://mchittineni.github.io/iacsecbench/"
DOI = "https://doi.org/10.5281/zenodo.21645016"

[project.optional-dependencies]
# The gates, and nothing else: ci.yml runs ruff, flake8, bandit and pytest, and
# .pre-commit-config.yaml adds autoflake, isort and pylint. Kept in step with
# those two files so that `pip install -e .[dev]` reproduces the checks a
# contributor's PR will actually face.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.16.0",
    "flake8>=7.0.0",
    "flake8-pytest-style",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-print",
    "darglint",
    "isort>=5.0.0",
    "autoflake>=2.0.0",
    "bandit[toml]>=1.9.0",
    "pylint>=3.0.0",
]

# Only security_framework is a distributable package. benchmark, evaluation and
# experiments are deliberately not: they are run from a checkout as `python -m
# evaluation.corpus` and friends, and their paths are baked into the recorded
# artefacts under results/. Declaring them here would be the first step towards
# a measurement whose provenance is an installed wheel rather than this tree.
#
# Without this section setuptools refuses the flat layout outright ("Multiple
# top-level packages discovered"), which made `pip install -e '.[dev]'` -- and so
# the dev extras above -- impossible to use.
[tool.setuptools]
packages = ["security_framework", "security_framework.engine"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = [
    "evaluation/tests",
    "security_framework/tests",
]

pythonpath = ["."]
python_files = [
    "test_*.py",
    "*_test.py",
]
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".external-corpus",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "UP042", "E402", "N806", "E701"]

[tool.isort]
profile = "black"
line_length = 100

# No [tool.black] section: ruff-format is the formatter in both ci.yml and
# .pre-commit-config.yaml, and nothing invoked black.
# No [tool.flake8] section either: flake8 does not read pyproject.toml, so the one
# that used to live here was dead configuration that read as live. The settings
# flake8 obeys are in .flake8.

[tool.bandit]
skips = ["B101", "B404", "B405", "B603"]
# docs/scratch left with the application it documented. .external-corpus holds
# third-party working trees fetched by commit; their findings are not this
# project's to triage.
exclude_dirs = [".venv", ".external-corpus"]

[tool.pylint.messages_control]
max-line-length = 112
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "C0415", # import-outside-toplevel
    "C0103", # invalid-name
    "R0903", # too-few-public-methods
    "R0902", # too-many-instance-attributes
    "R0912", # too-many-branches
    "R0914", # too-many-locals
    "R0915", # too-many-statements
    "R0801", # duplicate-code
    "W0212", # protected-access
    "C0413", # wrong-import-position
    "E0401", # import-error
    "C0301", # line-too-long
    "C0325", # superfluous-parens
    "R0913", # too-many-arguments
    "R0917", # too-many-positional-arguments
    "W1203", # logging-fstring-interpolation
    "W0707", # raise-missing-from
    "W0718", # broad-exception-caught
    "C1803", # use-implicit-booleaness-not-comparison
    "W0612", # unused-variable
    "R1705", # no-else-return
]
